<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Weekly Rotations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
body{margin:0}

/* Layout: ops board. Title + AM/PM toggle, week control, rotating job cards, handler assignments, then the schedule table. */
:root{
  --bg:#f4f1f9; --surface:#ffffff; --ink:#1d1530; --muted:#62597a; --line:#ddd5ea;
  --accent:#4d148c; --accent-ink:#ffffff; --hl:#f1e9fb;
  --orange:#ff6600; --orange-ink:#1d1530; --bad:#b42318;
  --j1:#4d148c; --j2:#c2510a; --j3:#7b3fbf; --j4:#9c3f08; --j5:#93287f; --j6:#5f5870;
  --j1bg:#ece3f7; --j2bg:#fff0e5; --j3bg:#f2eafb; --j4bg:#f9ebe1; --j5bg:#f8e8f4; --j6bg:#efedf2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15111d; --surface:#1f1a2a; --ink:#ece8f3; --muted:#a59cb5; --line:#342c44;
  --accent:#a97ff0; --accent-ink:#15111d; --hl:#2a2140;
  --orange:#ff7a1f; --orange-ink:#15111d; --bad:#ff8a80;
  --j1:#a97ff0; --j2:#ff8a3d; --j3:#d6b8ff; --j4:#ffb37f; --j5:#e98ad9; --j6:#b3acc2;
  --j1bg:#271c3d; --j2bg:#2f1d10; --j3bg:#2c2242; --j4bg:#30231a; --j5bg:#2e1a2c; --j6bg:#24212b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15111d; --surface:#1f1a2a; --ink:#ece8f3; --muted:#a59cb5; --line:#342c44;
  --accent:#a97ff0; --accent-ink:#15111d; --hl:#2a2140;
  --orange:#ff7a1f; --orange-ink:#15111d; --bad:#ff8a80;
  --j1:#a97ff0; --j2:#ff8a3d; --j3:#d6b8ff; --j4:#ffb37f; --j5:#e98ad9; --j6:#b3acc2;
  --j1bg:#271c3d; --j2bg:#2f1d10; --j3bg:#2c2242; --j4bg:#30231a; --j5bg:#2e1a2c; --j6bg:#24212b;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,48px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance;color:var(--accent);padding-bottom:6px;border-bottom:4px solid var(--orange);display:inline-block}
.sub{color:var(--muted);margin:6px 0 0}
.who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}

.weekbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.weekbar .info{flex:1 1 220px;min-width:0}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.weektitle{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1}
.status{display:inline-block;margin-left:8px;font-family:var(--body);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--orange);color:var(--orange-ink);vertical-align:middle}
.status.up{background:transparent;color:var(--orange);border:1px solid var(--orange)}
.btns{display:flex;gap:8px}
button{font:inherit;font-weight:600;font-size:14px;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,th button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.me{background:var(--hl);border-color:var(--accent);border-top-color:var(--c)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.jobnum{font-family:var(--mono);font-size:12px;color:var(--muted)}
.jobname{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.person{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.duties{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.duties li{display:grid;grid-template-columns:62px 1fr;gap:8px;font-size:14px}
.duties li.nl{grid-template-columns:1fr;color:var(--muted)}
.loc{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--c);padding-top:2px}
.next{font-size:13px;color:var(--muted)}

h2{font-family:var(--display);font-weight:700;font-size:24px;text-transform:uppercase;letter-spacing:.02em;margin:0}
.section{display:flex;flex-direction:column;gap:10px}
.note{color:var(--muted);margin:0;max-width:65ch}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px;font-variant-numeric:tabular-nums}
th,td{padding:10px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
thead th{font-weight:600;font-size:13px;color:var(--muted)}
thead th button{all:unset;cursor:pointer;display:flex;flex-direction:column;line-height:1.2}
thead th button span:first-child{font-family:var(--display);font-size:16px;font-weight:700;color:var(--ink)}
thead th.sel{background:var(--hl)}
thead th.sel button span:first-child{color:var(--accent)}
td.sel{background:var(--hl)}
tbody th{font-family:var(--display);font-size:18px;font-weight:700}
tr.me th{color:var(--accent)}
tr.me td,tr.me th{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:3px 8px;border-radius:5px;color:var(--c);background:var(--cb)}
.assign-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px}
.assign-week{font-weight:600;color:var(--muted)}
.save{font-size:13px;color:var(--muted);margin-left:auto}
.save.err{color:var(--bad);font-weight:600}
/* Four sections side by side, equal width; each card ends at its last job */
.groups{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:980px){.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.groups{grid-template-columns:minmax(0,1fr)}}
.group{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.group h3{margin:0;padding:10px 12px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 8px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-bottom:3px solid var(--orange)}
.group h3 small{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:0;text-transform:none;opacity:.9;white-space:nowrap}
.slot{display:flex;flex-direction:column;gap:5px;padding:9px 12px;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot label{font-size:13px;font-weight:600;min-width:0}
.slot label .n{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:4px}
.slot select{width:100%;min-width:0;padding:6px 8px;font-size:14px}
.slot select.filled{border-color:var(--accent);font-weight:600}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=date]{font:inherit;font-size:14px;font-weight:400;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=date]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.weekbar .jump{flex:0 1 auto}
.controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets button{padding:7px 10px;font-size:13px}
.presets button.on{border-color:var(--accent);color:var(--accent)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
#plan tbody tr.wk{cursor:pointer}
#plan tbody tr.wk:hover td,#plan tbody tr.wk:hover th{background:var(--hl)}
#plan tbody tr.wk:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#plan tbody th{font-family:var(--body);font-size:14px;font-weight:600}
#plan tbody th small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
#plan tr.month td{font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--bg);padding:6px 10px}
#plan tr.cur th,#plan tr.cur td{background:var(--hl)}
#plan th.mecol,#plan td.mecol{box-shadow:inset 2px 0 0 var(--orange),inset -2px 0 0 var(--orange)}
#plan thead th.mecol{color:var(--ink)}
.titlerow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.shift{display:inline-flex;gap:2px;padding:3px;border:2px solid var(--accent);border-radius:999px;background:var(--surface)}
.shift button{border:0;border-radius:999px;padding:5px 18px;background:transparent;color:var(--accent);font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.08em;line-height:1.1}
.shift button:hover:not(:disabled){background:var(--hl)}
.shift button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.editbtn{padding:5px 10px;font-size:13px}
.names{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.names h3{margin:0;font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.addrow{display:flex;flex-wrap:wrap;gap:8px}
.addrow input{flex:1 1 220px;min-width:0;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.addrow input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.namelist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px}
.namelist li{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0;padding:5px 5px 5px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:600;font-size:14px}
.namelist li span{overflow-wrap:anywhere}
.namelist button{padding:4px 9px;font-size:12px}
.namelist button.confirm{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.emptymsg{color:var(--muted);margin:0}
@media (max-width:480px){.person{font-size:30px}.weektitle{font-size:24px}.count{margin-left:0;width:100%}}
@media (prefers-reduced-motion:no-preference){.card{transition:background .2s,border-color .2s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titlerow">
      <h1>Weekly Rotations</h1>
      <div class="shift" role="group" aria-label="Shift">
        <button id="shift-AM" data-s="AM" aria-pressed="false">AM</button>
        <button id="shift-PM" data-s="PM" aria-pressed="false">PM</button>
      </div>
    </div>
    <label class="who" for="me">Highlight
      <select id="me"><option value="">Nobody</option></select>
    </label>
  </header>

  <div class="weekbar">
    <div class="info">
      <div class="eyebrow" id="cycle"></div>
      <div class="weektitle" id="weektitle"></div>
    </div>
    <label class="field jump" for="jump">Go to a date
      <input type="date" id="jump">
    </label>
    <div class="btns">
      <button id="prev" aria-label="Previous week">‹ Prev</button>
      <button id="today" class="primary">This week</button>
      <button id="next" aria-label="Next week">Next ›</button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <section class="section" id="assign">
    <div class="assign-head">
      <h2>Assignments</h2>
      <span class="assign-week" id="aweek"></span>
      <span class="save" id="asave" role="status" aria-live="polite"></span>
      <button class="editbtn" id="editnames" aria-expanded="false" aria-controls="names">Edit names</button>
    </div>
    <div class="names" id="names" hidden>
      <h3 id="namestitle">Names</h3>
      <form class="addrow" id="addform" autocomplete="off">
        <input id="newname" maxlength="40" placeholder="New hire's name" aria-label="New name">
        <button class="primary" type="submit">Add name</button>
      </form>
      <ul class="namelist" id="namelist"></ul>
    </div>
    <p class="emptymsg" id="wnote" hidden>No names in the dropdowns yet. Click Edit names to add your team.</p>
    <p class="note" id="anote" hidden>Not connected to the online database yet, so picks only save on this device.</p>
    <div class="groups" id="groups"></div>
  </section>

  <section class="section">
    <h2>Schedule</h2>
    <div class="controls">
      <label class="field" for="from">From
        <input type="date" id="from">
      </label>
      <label class="field" for="to">To
        <input type="date" id="to">
      </label>
      <div class="presets" role="group" aria-label="Quick ranges">
        <button data-m="3">3 months</button>
        <button data-m="6">6 months</button>
        <button data-m="12">1 year</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="tablewrap"><table id="plan"></table></div>
  </section>
</div>

<script>
// ===== Online database (Supabase). Paste your Project URL and publishable key between the quotes. =====
const SUPABASE_URL="https://rdtnudkspclegcrugucj.supabase.co";
const SUPABASE_KEY="sb_publishable_U7-qh3R0Ou-B0f__ZS04mw_vmo_PNRT";
const DB_ON=!!(SUPABASE_URL&&SUPABASE_KEY);

// ===== Shift setup =====
// jobs: rotating top jobs, in rotation order. people: [name, starting job number - 1].
// sections: handler assignment headers and jobs (repeat a job to get more than one dropdown).
// defaultWorkers: only used until names are saved in the database. table: where assignments are saved.
const SHIFTS={
 PM:{
  jobs:[
   {name:"DG (Dangerous Goods)",short:"DG",duties:[
     ["BTVRT","Heavyweights before the sort"],
     ["BTVA","DG at the Sort"],
     ["Airport","DG at the Airport"]]},
   {name:"Flight Agent",short:"Flight",duties:[
     ["BTVRT","Heavyweights before the sort"],
     ["BTVA","Float during the sort"],
     ["BTVR","Flight duties"]]},
   {name:"Float/WASP",short:"Float/WASP",duties:[
     ["BTVRT","Help with heavyweights"],
     ["BTVA","1600: float and cover van lines 1–2"],
     ["Airport","1800: go with the handler team and lead ground setup"],
     ["Airport","WASP duties during loading"]]},
   {name:"Late Freight",short:"Late Freight",duties:[
     ["BTVRT","Help with heavyweights"],
     ["BTVA","1600: cover van lines 3–4"],
     ["BTVA","Help shut down the sort; stay until 1940 to collect late freight"],
     ["BTVR","Bring late freight over"]]},
   {name:"Load Captain Setup at Ramp",short:"Load Captain",duties:[
     ["BTVA","Sort setup first thing"],
     ["BTVRT","Help with heavyweights"],
     ["BTVA","Float during the sort"],
     ["BTVR","Go with the handlers; setup and load captain for loading the plane"]]},
   {name:"Setup or Late Freight",short:"Setup or LF",duties:[
     ["BTVR","Mondays: ramp scale inspection"],
     ["BTVRT","Help with heavyweights"],
     ["BTVA","Float during the sort"],
     ["BTVR","Winter: go over early to clean the ramp and get equipment ready"],
     ["Customs","Customs run when needed"]]}
  ],
  people:[["Tom",0],["Justin",1],["Ryan",2],["Colin",3],["Cooper",4],["Braeden",5]],
  sections:[
   ["BELLIES",["Aft Load Capt / Pos Check","Fwd Load Capt / Pos Check","Fwd Security Check","Aft Security Check","Box Truck Driver (unload or in belly)","Unload Truck","In Belly","In Belly","In Belly"]],
   ["TOPSIDE",["Security Checks/Load Captain","Commander Operator","Push Cans","Push Cans"]],
   ["GROUNDS",["Wing-Walker","Connect Tug to Stairs / Lock Gate","Park Commander"]],
   ["WASP",["Assist Ramp Agent"]]
  ],
  defaultWorkers:["Alexander","Braeden","Colin","Cooper","Daniel","Jordan","Justin","Lenny","Leo","Miranda","Nick","Novak","Robert","Ryan","Steve","Thomas","Tom I","Zach"],
  table:"assignments"
 },
 AM:{
  jobs:[
   {name:"Job 1",short:"Job 1",duties:[["","Duties to be added"]]},
   {name:"Job 2",short:"Job 2",duties:[["","Duties to be added"]]},
   {name:"Job 3",short:"Job 3",duties:[["","Duties to be added"]]}
  ],
  people:[["Chuck",0],["Justin",1],["Tim",2]],
  sections:[
   ["BELLIES",["Handler Job 1","Handler Job 2","Handler Job 3","Handler Job 4","Handler Job 5","Handler Job 6"]],
   ["TOPSIDE",["Handler Job 7","Handler Job 8","Handler Job 9","Handler Job 10"]],
   ["GROUNDS",["Handler Job 11","Handler Job 12","Handler Job 13"]],
   ["WASP",["Handler Job 14","Handler Job 15"]]
  ],
  defaultWorkers:[],
  table:"am_assignments"
 }
};
for(const k in SHIFTS){const S=SHIFTS[k];S.slots=[];
  S.sections.forEach(([sec,jobs])=>{const tot={},c={};jobs.forEach(j=>tot[j]=(tot[j]||0)+1);
    jobs.forEach(j=>{c[j]=(c[j]||0)+1;S.slots.push({sec,job:j,n:tot[j]>1?c[j]:0})})});
  S.headers=S.slots.map(x=>`${x.sec} - ${x.job}${x.n?` (${x.n})`:""}`)}

// ===== Dates =====
const START=Date.UTC(2026,9,26), DAY=86400000;
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MAXW=104;
const weekStart=w=>new Date(START+w*7*DAY);
const fmt=d=>MON[d.getUTCMonth()]+" "+d.getUTCDate();
const range=w=>{const a=weekStart(w),b=new Date(a.getTime()+4*DAY);return fmt(a)+" – "+fmt(b)};
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const now=new Date(), todayUTC=Date.UTC(now.getFullYear(),now.getMonth(),now.getDate());
const rawCur=Math.floor((todayUTC-START+2*DAY)/(7*DAY)); // Sat/Sun roll forward to the coming work week
const curWeek=Math.max(0,rawCur);
function weekOfISO(v){if(!v)return null;const [y,m,d]=v.split("-").map(Number);if(!y)return null;return Math.floor((Date.UTC(y,m-1,d)-START+2*DAY)/(7*DAY))}
function addMonths(d,k){const x=new Date(d.getTime());x.setUTCMonth(x.getUTCMonth()+k);return x}
const cv=n=>`var(--j${n%6+1})`, cb=n=>`var(--j${n%6+1}bg)`;
const esc=t=>String(t).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

// ===== State =====
const hashShift=(location.hash||"").replace("#","").toUpperCase();
let shift=SHIFTS[hashShift]?hashShift:(SHIFTS[lsGet("btv-shift")]?lsGet("btv-shift"):"PM");
let week=curWeek, preset=3;
const meBy={PM:lsGet("btv-me-PM")??lsGet("btv-me")??"",AM:lsGet("btv-me-AM")??""};
const S=()=>SHIFTS[shift];
const jobOf=(p,w)=>(p[1]+w)%S().jobs.length;
const personOn=(j,w)=>S().people.find(p=>jobOf(p,w)===j);

// ===== Highlight + shift toggle =====
const sel=document.getElementById("me");
function fillHighlight(){
  sel.innerHTML='<option value="">Nobody</option>'+S().people.map(p=>`<option>${esc(p[0])}</option>`).join("");
  sel.value=S().people.some(p=>p[0]===meBy[shift])?meBy[shift]:"";
}
sel.onchange=()=>{meBy[shift]=sel.value;lsSet("btv-me-"+shift,sel.value);render()};
function setShift(k){
  shift=k;lsSet("btv-shift",k);
  document.querySelectorAll(".shift button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.s===k)));
  document.title=`Weekly Rotations · ${k}`;
  fillHighlight();render();
  if(!workers[k].loaded)loadWorkers(k);
}
document.querySelectorAll(".shift button").forEach(b=>b.onclick=()=>{if(b.dataset.s!==shift)setShift(b.dataset.s)});

// ===== Database helpers =====
function dbHeaders(extra){const h={apikey:SUPABASE_KEY};if(!SUPABASE_KEY.startsWith("sb_"))h.Authorization="Bearer "+SUPABASE_KEY;return Object.assign(h,extra||{})}
const api=t=>SUPABASE_URL.replace(/\/+$/,"")+"/rest/v1/"+t;
let saveTimer=null;
function setSave(msg,err){const el=document.getElementById("asave");el.textContent=msg;el.classList.toggle("err",!!err);
  clearTimeout(saveTimer);if(/^Saved|^Added|^Removed/.test(msg))saveTimer=setTimeout(()=>{el.textContent=""},2500)}

// ===== Weekly assignments (store[shift][week] = { "BELLIES - In Belly (1)": "Tom I" }) =====
const store={PM:{},AM:{}}, loaded={PM:new Set(),AM:new Set()}, pending={PM:0,AM:0};
if(!DB_ON){for(const k in store){try{store[k]=JSON.parse(lsGet("btv-assign-"+k)||"{}")||{}}catch(e){}}}
async function loadWeek(sh,wk,quiet){
  if(!DB_ON){loaded[sh].add(wk);return}
  if(!quiet)setSave("Loading…");
  try{const r=await fetch(`${api(SHIFTS[sh].table)}?select=job,name&week=eq.${wk}`,{headers:dbHeaders(),cache:"no-store"});
    if(!r.ok)throw new Error(r.status);const rows=await r.json();
    if(pending[sh]===0){const o={};rows.forEach(x=>{o[x.job]=x.name});store[sh][wk]=o}
    loaded[sh].add(wk);if(!quiet)setSave("")}
  catch(e){setSave("Couldn't load assignments. Check your connection and refresh.",true)}
  if(sh===shift&&iso(weekStart(week))===wk)renderAssign();
}
async function saveSlot(sh,wk,i,name){
  const key=SHIFTS[sh].headers[i];store[sh][wk]=Object.assign({},store[sh][wk]||{},{[key]:name});renderAssign();
  if(!DB_ON){lsSet("btv-assign-"+sh,JSON.stringify(store[sh]));setSave("Saved on this device");return}
  pending[sh]++;setSave("Saving…");
  try{const r=await fetch(`${api(SHIFTS[sh].table)}?on_conflict=week,job`,{method:"POST",
      headers:dbHeaders({"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"}),
      body:JSON.stringify([{week:wk,job:key,name,updated_at:new Date().toISOString()}])});
    if(!r.ok)throw new Error(r.status);setSave("Saved")}
  catch(e){setSave("Didn't save. Check your connection and pick the name again.",true)}
  finally{pending[sh]--}
}

// ===== Dropdown names (saved per shift in the "workers" table) =====
const byName=(a,b)=>a.localeCompare(b,undefined,{sensitivity:"base"});
const workers={PM:{list:[],fromDefaults:true,loaded:false},AM:{list:[],fromDefaults:true,loaded:false}};
function useDefaults(sh){workers[sh].list=SHIFTS[sh].defaultWorkers.slice().sort(byName);workers[sh].fromDefaults=true}
async function loadWorkers(sh,quiet){
  const W=workers[sh];
  if(!DB_ON){const saved=lsGet("btv-workers-"+sh);if(saved){try{W.list=JSON.parse(saved);W.fromDefaults=false}catch(e){useDefaults(sh)}}else useDefaults(sh);
    W.loaded=true;if(sh===shift)renderAssign();return}
  try{const r=await fetch(`${api("workers")}?select=name,active&shift=eq.${sh}`,{headers:dbHeaders(),cache:"no-store"});
    if(!r.ok)throw new Error(r.status);const rows=await r.json();
    if(!rows.length)useDefaults(sh);else{W.list=rows.filter(x=>x.active).map(x=>x.name).sort(byName);W.fromDefaults=false}}
  catch(e){if(!W.loaded)useDefaults(sh);if(!quiet)setSave("Couldn't load the name list. Check your connection and refresh.",true)}
  W.loaded=true;if(sh===shift)renderAssign();
}
async function upsertWorkers(sh,rows){
  const r=await fetch(`${api("workers")}?on_conflict=shift,name`,{method:"POST",
    headers:dbHeaders({"Content-Type":"application/json","Prefer":"resolution=merge-duplicates,return=minimal"}),
    body:JSON.stringify(rows.map(x=>Object.assign({shift:sh},x)))});
  if(!r.ok)throw new Error(r.status);
}
async function addWorker(sh,name){
  const W=workers[sh];name=name.replace(/\s+/g," ").trim();
  if(!name){setSave("Type a name first.",true);return false}
  if(W.list.some(n=>byName(n,name)===0)){setSave(`${name} is already on the list.`,true);return false}
  const next=W.list.concat([name]).sort(byName);
  if(DB_ON){setSave("Saving…");
    try{const rows=(W.fromDefaults?W.list:[]).map(n=>({name:n,active:true})).concat([{name,active:true}]);await upsertWorkers(sh,rows)}
    catch(e){setSave("Didn't add the name. Check your connection and try again.",true);return false}}
  else lsSet("btv-workers-"+sh,JSON.stringify(next));
  W.list=next;W.fromDefaults=false;setSave(`Added ${name}`);renderAssign();return true;
}
async function removeWorker(sh,name){
  const W=workers[sh];const next=W.list.filter(n=>n!==name);
  if(DB_ON){setSave("Saving…");
    try{if(W.fromDefaults)await upsertWorkers(sh,W.list.map(n=>({name:n,active:n!==name})));
      else{const r=await fetch(`${api("workers")}?shift=eq.${sh}&name=eq.${encodeURIComponent(name)}`,{method:"PATCH",
          headers:dbHeaders({"Content-Type":"application/json","Prefer":"return=minimal"}),body:JSON.stringify({active:false})});
        if(!r.ok)throw new Error(r.status)}}
    catch(e){setSave("Didn't remove the name. Check your connection and try again.",true);return}}
  else lsSet("btv-workers-"+sh,JSON.stringify(next));
  W.list=next;W.fromDefaults=false;setSave(`Removed ${name}`);renderAssign();
}
const namesPanel=document.getElementById("names"), editBtn=document.getElementById("editnames");
editBtn.onclick=()=>{namesPanel.hidden=!namesPanel.hidden;editBtn.setAttribute("aria-expanded",String(!namesPanel.hidden));
  editBtn.textContent=namesPanel.hidden?"Edit names":"Done editing";if(!namesPanel.hidden)document.getElementById("newname").focus()};
document.getElementById("addform").onsubmit=async e=>{e.preventDefault();const inp=document.getElementById("newname");
  if(await addWorker(shift,inp.value)){inp.value="";inp.focus()}};
function renderNames(){
  const W=workers[shift];
  document.getElementById("namestitle").textContent=`${shift} names (${W.list.length})`;
  const ul=document.getElementById("namelist");
  ul.innerHTML=W.list.length?W.list.map(n=>`<li><span>${esc(n)}</span><button type="button" data-n="${esc(n)}">Remove</button></li>`).join("")
    :'<li style="border-style:dashed;font-weight:400;color:var(--muted)">No names yet</li>';
  ul.querySelectorAll("button[data-n]").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("confirm")){removeWorker(shift,b.dataset.n);return}
    b.classList.add("confirm");b.textContent="Tap to confirm";
    setTimeout(()=>{if(b.isConnected){b.classList.remove("confirm");b.textContent="Remove"}},3000)});
}

function renderAssign(){
  const sh=shift,Sx=S(),wk=iso(weekStart(week)),arr=store[sh][wk]||{},W=workers[sh];
  if(!loaded[sh].has(wk))loadWeek(sh,wk);
  document.getElementById("aweek").textContent=`${sh} · Week of ${range(week)}`;
  document.getElementById("anote").hidden=DB_ON;
  document.getElementById("wnote").hidden=!(W.loaded&&!W.list.length);
  renderNames();
  const focusId=document.activeElement&&document.activeElement.id;
  const parts=[];let i=0;
  Sx.sections.forEach(([sec,jobs])=>{let rows="",filled=0;
    jobs.forEach(()=>{const x=Sx.slots[i],v=arr[Sx.headers[i]]||"";if(v)filled++;
      const opts=[""].concat(W.list);if(v&&!W.list.includes(v))opts.push(v);
      rows+=`<div class="slot"><label for="slot-${i}">${esc(x.job)}${x.n?`<span class="n">#${x.n}</span>`:""}</label>
        <select id="slot-${i}" data-i="${i}" class="${v?"filled":""}">${opts.map(o=>`<option value="${esc(o)}"${o===v?" selected":""}>${o?esc(o):"—"}</option>`).join("")}</select></div>`;i++});
    parts.push(`<div class="group"><h3>${esc(sec)}<small>${filled} of ${jobs.length} filled</small></h3>${rows}</div>`)});
  const g=document.getElementById("groups");g.innerHTML=parts.join("");
  g.querySelectorAll("select").forEach(el=>el.onchange=()=>saveSlot(sh,wk,+el.dataset.i,el.value));
  if(focusId&&focusId.startsWith("slot-")){const f=document.getElementById(focusId);if(f)f.focus()}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&DB_ON){loadWeek(shift,iso(weekStart(week)),true);loadWorkers(shift,true)}});

// ===== Main render =====
function render(){
  const Sx=S(),n=Sx.jobs.length,me=meBy[shift];
  document.getElementById("weektitle").innerHTML=`Week of ${range(week)}`+
    (week===rawCur?'<span class="status">This week</span>':(rawCur<0&&week===0?'<span class="status up">Starts Monday</span>':''));
  document.getElementById("cycle").textContent=`${shift} shift · Week ${week%n+1} of ${n} in the cycle`;
  document.getElementById("prev").disabled=week===0;
  document.getElementById("today").disabled=week===curWeek;
  document.getElementById("board").innerHTML=Sx.jobs.map((j,i)=>{
    const p=personOn(i,week), nx=personOn(i,week+1);
    return `<article class="card${p&&p[0]===me?" me":""}" style="--c:${cv(i)}">
      <div class="top"><span class="jobname">${esc(j.name)}</span><span class="jobnum">JOB ${i+1}</span></div>
      <div class="person">${p?esc(p[0]):"—"}</div>
      <ul class="duties">${j.duties.map(d=>d[0]?`<li><span class="loc">${esc(d[0])}</span><span>${esc(d[1])}</span></li>`:`<li class="nl"><span>${esc(d[1])}</span></li>`).join("")}</ul>
      <div class="next">Next week: ${nx?esc(nx[0]):"—"}</div>
    </article>`}).join("");
  document.getElementById("jump").value=iso(weekStart(week));
  renderPlan();
  renderAssign();
}
function renderPlan(){
  const Sx=S(),n=Sx.jobs.length,me=meBy[shift];
  const fromW=Math.max(0,weekOfISO(fromEl.value)??curWeek);
  let toW=weekOfISO(toEl.value)??fromW+12;
  if(toW<fromW) toW=fromW;
  let capped=false; if(toW-fromW>MAXW-1){toW=fromW+MAXW-1;capped=true}
  const cnt=toW-fromW+1;
  document.getElementById("count").textContent=`${cnt} week${cnt>1?"s":""}`+(capped?` (showing the first ${MAXW})`:"");
  let h=`<thead><tr><th scope="col">Week of</th>`+Sx.people.map(p=>
    `<th scope="col" class="${p[0]===me?"mecol":""}">${esc(p[0])}</th>`).join("")+`</tr></thead><tbody>`;
  let lastMonth=-1;
  for(let w=fromW;w<=toW;w++){
    const d=weekStart(w), m=d.getUTCMonth();
    if(m!==lastMonth){h+=`<tr class="month"><td colspan="${Sx.people.length+1}">${MONTHS[m]} ${d.getUTCFullYear()}</td></tr>`;lastMonth=m}
    h+=`<tr class="wk${w===week?" cur":""}" data-w="${w}" tabindex="0"><th scope="row">${range(w)}<small>Cycle week ${w%n+1}</small></th>`+
      Sx.people.map(p=>{const j=jobOf(p,w);
        return `<td class="${p[0]===me?"mecol":""}"><span class="chip" style="--c:${cv(j)};--cb:${cb(j)}">${esc(Sx.jobs[j].short)}</span></td>`}).join("")+`</tr>`;
  }
  const t=document.getElementById("plan");t.innerHTML=h+"</tbody>";
  t.querySelectorAll("tr.wk").forEach(r=>{
    const go=()=>{week=+r.dataset.w;render();document.querySelector(".weekbar").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})};
    r.onclick=go; r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}};
  });
  document.querySelectorAll(".presets button").forEach(b=>b.classList.toggle("on",+b.dataset.m===preset));
}
document.getElementById("prev").onclick=()=>{if(week>0){week--;render()}};
document.getElementById("next").onclick=()=>{week++;render()};
document.getElementById("today").onclick=()=>{week=curWeek;render()};
document.getElementById("jump").onchange=e=>{const w=weekOfISO(e.target.value);if(w===null)return;week=Math.max(0,w);render()};
const fromEl=document.getElementById("from"), toEl=document.getElementById("to");
function setPreset(m){preset=m;const a=weekStart(curWeek);fromEl.value=iso(a);toEl.value=iso(new Date(addMonths(a,m).getTime()-DAY));renderPlan()}
fromEl.min=toEl.min=iso(weekStart(0));
fromEl.onchange=toEl.onchange=()=>{preset=0;renderPlan()};
document.querySelectorAll(".presets button").forEach(b=>b.onclick=()=>setPreset(+b.dataset.m));
{const a=weekStart(curWeek);fromEl.value=iso(a);toEl.value=iso(new Date(addMonths(a,3).getTime()-DAY))}
setShift(shift);
</script>
